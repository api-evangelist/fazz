method: searched
source: >-
  Public registries (PyPI, Packagist) and the Fazz/Xfers GitHub organization
  (https://github.com/xfers). Fazz publishes no SDK for the current v4 Payments
  API in its developer docs; the first-party client libraries below date from
  the Xfers era and are legacy/archived. A community Go SDK also exists.
notes: >-
  The four Xfers-org libraries are first-party (published by the FazzEngineering /
  Xfers GitHub org) but target the legacy Xfers API, not the documented v4
  Fazz Payments API, and are archived/abandoned. Treat as reference only; the
  current recommendation from the docs is direct HTTPS + HTTP Basic auth.

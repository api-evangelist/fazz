aid: fazz
url: https://raw.githubusercontent.com/api-evangelist/fazz/refs/heads/main/apis.yml
name: Fazz
kind: company
description: Fazz is a Southeast Asian business banking and payments group formed from
  the 2021 merger of Indonesia's Payfazz and Singapore's Xfers. Its Fazz Business
  Payments API (served on the xfers.io hosts) lets platforms accept payments via local
  methods like PayNow QR and virtual bank accounts, and send bulk disbursements
  across Singapore (SGD) and Indonesia (IDR). Not to be confused with the consumer-facing
  Payfazz agent app.

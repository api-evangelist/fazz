specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Fazz
providerId: fazz
created: '2026-07-17'
modified: '2026-07-17'
reconciled: false
tags:
- Fintech
- Payments
- Disbursements
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Fazz Business Payments API spend. Fazz charges
  per-transaction fees on payments collected (Accept API) and payouts sent
  (Send API), quoted per merchant, on top of a business account with no
  monthly minimum. Costs are transaction-count driven and split by market
  (SGD for Singapore, IDR for Indonesia) and payment method.
notes: >-
  Per-method fees are account/quote based and not published as a flat rate
  card; reconcile actual fees from Fazz Business statements and dashboard
  exports.
sources:
- https://fazz.com/en/pricing/
- https://docs.fazz.com/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Fazz
serviceCategory: Financial Services
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: SGD
  additionalCurrencies:
  - IDR
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Fazz Business Payments API
  ServiceCategory: Financial Services
  ProviderName: Fazz
  PublisherName: Fazz
  InvoiceIssuerName: Xfers Pte. Ltd. (Fazz Business Singapore)
  BillingCurrency: SGD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: accept_transactions
  description: Payments collected via the Accept API (PayNow, virtual bank account), billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - payment_method
  - currency
- name: send_transactions
  description: Disbursements/payouts sent via the Send API, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - disbursement_method
  - currency
- name: settlement_volume
  description: Gross value settled through payments and disbursements, used to model transaction-fee exposure.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - currency
principles:
- name: Visibility
  description: Pull Fazz Business dashboard statements/exports; track fees per payment method and per market.
- name: Allocation
  description: Tag payments and disbursements with referenceId per workload/customer; map to internal cost centers.
- name: Optimization
  description: Route collections to lower-fee local methods (e.g. PayNow) where suitable; batch disbursements.
- name: Accountability
  description: Assign owners per merchant account/market; review transaction-fee spend monthly against volume.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
